{% extends "base.html" %}
{% block title %}注册｜个人健康记录{% endblock %}
{% block content %}
    <h1>创建账号</h1>
    <p>手机号不会经过短信验证，仅作为登录账号标识。</p>
    <p>密码至少 8 位。</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">注册</button>
    </form>
    <a href="{% url 'accounts:login' %}">已有账号，去登录</a>
{% endblock %}
